<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raamatuhaldussüsteem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-book-open me-2"></i>Raamatuhaldus
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4 form-card">
                    <div class="card-header">
                        <h3 id="authorFormTitle" class="mb-0">
                            <i class="fas fa-user-plus me-2"></i>Lisa Autor
                        </h3>
                    </div>
                    <div class="card-body">
                        <form id="authorForm">
                            <input type="hidden" id="authorId">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Eesnimi</label>
                                    <input type="text" class="form-control" id="firstName" required placeholder="Sisesta eesnimi">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Perekonnanimi</label>
                                    <input type="text" class="form-control" id="lastName" required placeholder="Sisesta perekonnanimi">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Biograafia</label>
                                <textarea class="form-control" id="biography" rows="3" placeholder="Kirjuta autori lühibiograafia"></textarea>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary" id="authorSubmitBtn">
                                    <i class="fas fa-save me-2"></i>Salvesta
                                </button>
                                <button type="button" class="btn btn-secondary" id="authorCancelBtn" style="display: none;">
                                    <i class="fas fa-times me-2"></i>Tühista
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Book Form -->
        <div class="card mb-4">
            <div class="card-header">
                <h3 id="bookFormTitle">Add Book</h3>
            </div>
            <div class="card-body">
                <form id="bookForm">
                    <input type="hidden" id="bookId">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" id="bookTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ISBN</label>
                        <input type="text" class="form-control" id="bookIsbn">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Published Year</label>
                        <input type="number" class="form-control" id="bookYear">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="bookDescription"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" step="0.01" class="form-control" id="bookPrice">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Author</label>
                        <select class="form-control" id="bookAuthor" required>
                            <option value="">Select an author</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-users me-2"></i>Autorid
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="authorsList" class="row"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-book-reader me-2"></i>Raamatud
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="booksList" class="row"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API endpoints - automatically use the current domain
        const API_URL = window.location.origin + '/api';
        const BOOKS_API = `${API_URL}/books`;
        const AUTHORS_API = `${API_URL}/authors`;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let editingAuthorId = null;
        let editingBookId = null;

        // Load authors
        async function loadAuthors() {
            try {
                const response = await fetch(`${AUTHORS_API}`);
                const authors = await response.json();
                const select = document.getElementById('bookAuthor');
                const authorsList = document.getElementById('authorsList');
                
                if (select) {
                    select.innerHTML = '<option value="">Select an author</option>';
                    authors.forEach(author => {
                        select.innerHTML += `
                            <option value="${author.id}">${author.firstName} ${author.lastName}</option>
                        `;
                    });
                }
                
                if (authorsList) {
                    authorsList.innerHTML = '';
                    authors.forEach(author => {
                        authorsList.innerHTML += `
                            <div class="card mb-2">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <h5>${author.firstName} ${author.lastName}</h5>
                                        <div>
                                            <button class="btn btn-sm btn-primary" onclick="editAuthor(${author.id})">Edit</button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteAuthor(${author.id})">Delete</button>
                                        </div>
                                    </div>
                                    <p class="mt-2 mb-0">${author.biography || 'No biography available'}</p>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error('Error loading authors:', error);
            }
        }

        // Load books
        async function loadBooks() {
            try {
                const response = await fetch(`${BOOKS_API}`);
                const books = await response.json();
                const booksList = document.getElementById('booksList');

                booksList.innerHTML = '';
                books.forEach(book => {
                    booksList.innerHTML += `
                        <div class="col-md-6 mb-4">
                            <div class="card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <h5>${book.title}</h5>
                                        <div>
                                            <button class="btn btn-sm btn-primary" onclick="editBook(${book.id})">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteBook(${book.id})">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <p>ISBN: ${book.isbn || 'Puudub'}</p>
                                    <p>Ilmumisaasta: ${book.publishedYear || 'Puudub'}</p>
                                    <p>Autor: ${book.author ? `${book.author.firstName} ${book.author.lastName}` : 'Tundmatu'}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading books:', error);
            }
        }

        // Edit author
        async function editAuthor(id) {
            try {
                const response = await fetch(`${AUTHORS_API}/${id}`);
                const author = await response.json();

                document.getElementById('authorId').value = author.id;
                document.getElementById('firstName').value = author.firstName;
                document.getElementById('lastName').value = author.lastName;
                document.getElementById('biography').value = author.biography || '';

                document.getElementById('authorFormTitle').textContent = 'Muuda Autor';
                document.getElementById('authorSubmitBtn').textContent = 'Salvesta Muudatused';
                document.getElementById('authorCancelBtn').style.display = 'inline-block';
                editingAuthorId = id;
            } catch (error) {
                console.error('Error fetching author:', error);
            }
        }

        // Edit book
        async function editBook(id) {
            try {
                const response = await fetch(`${BOOKS_API}/${id}`);
                const book = await response.json();

                document.getElementById('bookId').value = book.id;
                document.getElementById('bookTitle').value = book.title;
                document.getElementById('bookIsbn').value = book.isbn || '';
                document.getElementById('bookYear').value = book.publishedYear || '';
                document.getElementById('bookDescription').value = book.description || '';
                document.getElementById('bookPrice').value = book.price || '';
                document.getElementById('bookAuthor').value = book.authorId;
                
                document.getElementById('bookFormTitle').textContent = 'Edit Book';
                document.getElementById('bookSubmitBtn').textContent = 'Update Book';
                document.getElementById('bookCancelBtn').style.display = 'inline-block';
                editingBookId = id;
            } catch (error) {
                console.error('Error fetching book:', error);
            }
        }

        // Delete author
        async function deleteAuthor(id) {
            if (confirm('Kas olete kindel, et soovite kustutada selle autori? See kustutab ka kõik tema raamatud.')) {
                try {
                    await fetch(`${AUTHORS_API}/${id}`, {
                        method: 'DELETE'
                    });
                    loadAuthors();
                    loadBooks();
                } catch (error) {
                    console.error('Error deleting author:', error);
                }
            }
        }

        // Delete book
        async function deleteBook(id) {
            if (confirm('Kas olete kindel, et soovite kustutada selle raamatu?')) {
                try {
                    await fetch(`${BOOKS_API}/${id}`, {
                        method: 'DELETE'
                    });
                    loadBooks();
                } catch (error) {
                    console.error('Error deleting book:', error);
                }
            }
        }

        // Reset author form
        function resetAuthorForm() {
            document.getElementById('authorForm').reset();
            document.getElementById('authorId').value = '';
            document.getElementById('authorFormTitle').textContent = 'Lisa Autor';
            document.getElementById('authorSubmitBtn').textContent = 'Salvesta';
            document.getElementById('authorCancelBtn').style.display = 'none';
            editingAuthorId = null;
        }

        // Reset book form
        function resetBookForm() {
            document.getElementById('bookForm').reset();
            document.getElementById('bookId').value = '';
            document.getElementById('bookFormTitle').textContent = 'Lisa Raamat';
            document.getElementById('bookSubmitBtn').textContent = 'Salvesta';
            document.getElementById('bookCancelBtn').style.display = 'none';
            editingBookId = null;
        }

        // Handle author form submission
        document.getElementById('authorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const authorData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                biography: document.getElementById('biography').value
            };

            try {
                const url = editingAuthorId 
                    ? `${AUTHORS_API}/${editingAuthorId}`
                    : `${AUTHORS_API}`;
                
                const method = editingAuthorId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(authorData)
                });

                if (response.ok) {
                    resetAuthorForm();
                    loadAuthors();
                }
            } catch (error) {
                console.error('Error saving author:', error);
            }
        });

        // Handle book form submission
        document.getElementById('bookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bookData = {
                title: document.getElementById('bookTitle').value.trim(),
                isbn: document.getElementById('bookIsbn').value.trim() || null,
                publishedYear: parseInt(document.getElementById('bookYear').value) || null,
                description: document.getElementById('bookDescription').value.trim() || null,
                price: parseFloat(document.getElementById('bookPrice').value) || 0,
                authorId: parseInt(document.getElementById('bookAuthor').value)
            };

            console.log('Form data collected:', {
                title: document.getElementById('bookTitle').value,
                isbn: document.getElementById('bookIsbn').value,
                publishedYear: document.getElementById('bookYear').value,
                description: document.getElementById('bookDescription').value,
                price: document.getElementById('bookPrice').value,
                authorId: document.getElementById('bookAuthor').value
            });
            
            console.log('Processed book data:', bookData);

            // Validate required fields
            if (!bookData.title) {
                alert('Title is required');
                return;
            }
            if (!bookData.authorId) {
                alert('Please select an author');
                return;
            }

            // Validate publishedYear
            const currentYear = new Date().getFullYear();
            if (bookData.publishedYear && (bookData.publishedYear < 1000 || bookData.publishedYear > currentYear)) {
                alert(`Published year must be between 1000 and ${currentYear}`);
                return;
            }

            // Validate price
            if (bookData.price < 0) {
                alert('Price cannot be negative');
                return;
            }
            
            try {
                const url = editingBookId 
                    ? `${BOOKS_API}/${editingBookId}`
                    : BOOKS_API;
                
                const method = editingBookId ? 'PUT' : 'POST';
                
                console.log('Sending request:', {
                    url,
                    method,
                    data: bookData
                });

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookData)
                });

                const data = await response.json();
                console.log('Server response:', {
                    status: response.status,
                    statusText: response.statusText,
                    data
                });

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to save book');
                }

                resetBookForm();
                loadBooks();
            } catch (error) {
                console.error('Error saving book:', error);
                alert(error.message);
            }
        });

        // Handle cancel buttons
        document.getElementById('authorCancelBtn').addEventListener('click', resetAuthorForm);
        document.getElementById('bookCancelBtn').addEventListener('click', resetBookForm);

        // Initial load
        loadAuthors();
        loadBooks();
    </script>
</body>
</html>
