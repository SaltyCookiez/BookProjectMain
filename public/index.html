<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raamatuhaldussüsteem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-book-open me-2"></i>Raamatuhaldus
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4 form-card">
                    <div class="card-header">
                        <h3 id="authorFormTitle" class="mb-0">
                            <i class="fas fa-user-plus me-2"></i>Lisa Autor
                        </h3>
                    </div>
                    <div class="card-body">
                        <form id="authorForm">
                            <input type="hidden" id="authorId">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Eesnimi</label>
                                    <input type="text" class="form-control" id="firstName" required placeholder="Sisesta eesnimi">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Perekonnanimi</label>
                                    <input type="text" class="form-control" id="lastName" required placeholder="Sisesta perekonnanimi">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Biograafia</label>
                                <textarea class="form-control" id="biography" rows="3" placeholder="Kirjuta autori lühibiograafia"></textarea>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary" id="authorSubmitBtn">
                                    <i class="fas fa-save me-2"></i>Salvesta
                                </button>
                                <button type="button" class="btn btn-secondary" id="authorCancelBtn" style="display: none;">
                                    <i class="fas fa-times me-2"></i>Tühista
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mb-4 form-card">
                    <div class="card-header">
                        <h3 id="bookFormTitle" class="mb-0">
                            <i class="fas fa-book me-2"></i>Lisa Raamat
                        </h3>
                    </div>
                    <div class="card-body">
                        <form id="bookForm">
                            <input type="hidden" id="bookId">
                            <div class="mb-3">
                                <label class="form-label">Pealkiri</label>
                                <input type="text" class="form-control" id="title" required placeholder="Sisesta raamatu pealkiri">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">ISBN</label>
                                <input type="text" class="form-control" id="isbn" placeholder="Sisesta raamatu ISBN">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ilmumisaasta</label>
                                <input type="number" class="form-control" id="publishedYear" placeholder="Sisesta raamatu ilmumisaasta">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Autor</label>
                                <select class="form-control" id="authorSelect" required>
                                    <option value="">Vali autor</option>
                                </select>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary" id="bookSubmitBtn">
                                    <i class="fas fa-save me-2"></i>Salvesta
                                </button>
                                <button type="button" class="btn btn-secondary" id="bookCancelBtn" style="display: none;">
                                    <i class="fas fa-times me-2"></i>Tühista
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-users me-2"></i>Autorid
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="authorsList" class="row"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-book-reader me-2"></i>Raamatud
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="booksList" class="row"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';
        let editingAuthorId = null;
        let editingBookId = null;

        // Load authors
        async function loadAuthors() {
            try {
                const response = await fetch(`${API_URL}/authors`);
                const authors = await response.json();
                const select = document.getElementById('authorSelect');
                const authorsList = document.getElementById('authorsList');

                select.innerHTML = '<option value="">Vali autor</option>';
                authorsList.innerHTML = '';

                authors.forEach(author => {
                    select.innerHTML += `
                        <option value="${author.id}">${author.firstName} ${author.lastName}</option>
                    `;

                    authorsList.innerHTML += `
                        <div class="col-md-6 mb-4">
                            <div class="card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <h5>${author.firstName} ${author.lastName}</h5>
                                        <div>
                                            <button class="btn btn-sm btn-primary" onclick="editAuthor(${author.id})">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteAuthor(${author.id})">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <p>${author.biography || 'Biograafia puudub'}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading authors:', error);
            }
        }

        // Load books
        async function loadBooks() {
            try {
                const response = await fetch(`${API_URL}/books`);
                const books = await response.json();
                const booksList = document.getElementById('booksList');

                booksList.innerHTML = '';
                books.forEach(book => {
                    booksList.innerHTML += `
                        <div class="col-md-6 mb-4">
                            <div class="card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <h5>${book.title}</h5>
                                        <div>
                                            <button class="btn btn-sm btn-primary" onclick="editBook(${book.id})">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteBook(${book.id})">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <p>ISBN: ${book.isbn || 'Puudub'}</p>
                                    <p>Ilmumisaasta: ${book.publishedYear || 'Puudub'}</p>
                                    <p>Autor: ${book.author ? `${book.author.firstName} ${book.author.lastName}` : 'Tundmatu'}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading books:', error);
            }
        }

        // Edit author
        async function editAuthor(id) {
            try {
                const response = await fetch(`${API_URL}/authors/${id}`);
                const author = await response.json();

                document.getElementById('authorId').value = author.id;
                document.getElementById('firstName').value = author.firstName;
                document.getElementById('lastName').value = author.lastName;
                document.getElementById('biography').value = author.biography || '';

                document.getElementById('authorFormTitle').textContent = 'Muuda Autor';
                document.getElementById('authorSubmitBtn').textContent = 'Salvesta Muudatused';
                document.getElementById('authorCancelBtn').style.display = 'inline-block';
                editingAuthorId = id;
            } catch (error) {
                console.error('Error fetching author:', error);
            }
        }

        // Edit book
        async function editBook(id) {
            try {
                const response = await fetch(`${API_URL}/books/${id}`);
                const book = await response.json();

                document.getElementById('bookId').value = book.id;
                document.getElementById('title').value = book.title;
                document.getElementById('isbn').value = book.isbn || '';
                document.getElementById('publishedYear').value = book.publishedYear || '';
                document.getElementById('authorSelect').value = book.authorId;

                document.getElementById('bookFormTitle').textContent = 'Muuda Raamat';
                document.getElementById('bookSubmitBtn').textContent = 'Salvesta Muudatused';
                document.getElementById('bookCancelBtn').style.display = 'inline-block';
                editingBookId = id;
            } catch (error) {
                console.error('Error fetching book:', error);
            }
        }

        // Delete author
        async function deleteAuthor(id) {
            if (confirm('Kas olete kindel, et soovite kustutada selle autori? See kustutab ka kõik tema raamatud.')) {
                try {
                    await fetch(`${API_URL}/authors/${id}`, {
                        method: 'DELETE'
                    });
                    loadAuthors();
                    loadBooks();
                } catch (error) {
                    console.error('Error deleting author:', error);
                }
            }
        }

        // Delete book
        async function deleteBook(id) {
            if (confirm('Kas olete kindel, et soovite kustutada selle raamatu?')) {
                try {
                    await fetch(`${API_URL}/books/${id}`, {
                        method: 'DELETE'
                    });
                    loadBooks();
                } catch (error) {
                    console.error('Error deleting book:', error);
                }
            }
        }

        // Reset author form
        function resetAuthorForm() {
            document.getElementById('authorForm').reset();
            document.getElementById('authorId').value = '';
            document.getElementById('authorFormTitle').textContent = 'Lisa Autor';
            document.getElementById('authorSubmitBtn').textContent = 'Salvesta';
            document.getElementById('authorCancelBtn').style.display = 'none';
            editingAuthorId = null;
        }

        // Reset book form
        function resetBookForm() {
            document.getElementById('bookForm').reset();
            document.getElementById('bookId').value = '';
            document.getElementById('bookFormTitle').textContent = 'Lisa Raamat';
            document.getElementById('bookSubmitBtn').textContent = 'Salvesta';
            document.getElementById('bookCancelBtn').style.display = 'none';
            editingBookId = null;
        }

        // Handle author form submission
        document.getElementById('authorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const authorData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                biography: document.getElementById('biography').value
            };

            try {
                const url = editingAuthorId
                    ? `${API_URL}/authors/${editingAuthorId}`
                    : `${API_URL}/authors`;

                const method = editingAuthorId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(authorData)
                });

                if (response.ok) {
                    resetAuthorForm();
                    loadAuthors();
                }
            } catch (error) {
                console.error('Error saving author:', error);
            }
        });

        // Handle book form submission
        document.getElementById('bookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bookData = {
                title: document.getElementById('title').value,
                isbn: document.getElementById('isbn').value,
                publishedYear: document.getElementById('publishedYear').value,
                authorId: document.getElementById('authorSelect').value
            };

            try {
                const url = editingBookId
                    ? `${API_URL}/books/${editingBookId}`
                    : `${API_URL}/books`;

                const method = editingBookId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookData)
                });

                if (response.ok) {
                    resetBookForm();
                    loadBooks();
                }
            } catch (error) {
                console.error('Error saving book:', error);
            }
        });

        // Handle cancel buttons
        document.getElementById('authorCancelBtn').addEventListener('click', resetAuthorForm);
        document.getElementById('bookCancelBtn').addEventListener('click', resetBookForm);

        // Initial load
        loadAuthors();
        loadBooks();
    </script>
</body>
</html>
